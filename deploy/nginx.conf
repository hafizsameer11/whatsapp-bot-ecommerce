# Nginx site for the bot. Replace bot.yourshop.pk with your domain, then:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/whatsapp-bot
#   sudo ln -s /etc/nginx/sites-available/whatsapp-bot /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d bot.yourshop.pk        (adds HTTPS automatically)
server {
    listen 80;
    server_name bot.yourshop.pk;

    # photo uploads (25 MB) and Excel imports
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s; # large imports download many photos
    }
}
